<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 850" width="720" height="850" role="img" aria-labelledby="titre description">
<title id="titre">Les trois déploiements côte à côte</title>
<desc id="description">Trois projets Google séparés. chevalier-ia-os (CRM de Jérôme) et chevalier-ia-app (plateforme clients) partagent le même n8n ; Supabase est relié au CRM de Jérôme. Une maison client a son propre projet Google, avec sa base Cloud SQL pour les Achats et son propre n8n. Le CRM de Jérôme est publié automatiquement à chaque fusion, la plateforme clients par un bouton manuel sur GitHub, une maison depuis le Mac.</desc>
<style>
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#1f2328}
.th{font-size:14px;font-weight:600}
.ts{font-size:12px;fill:#3d4650}
.fond{fill:#ffffff}
.neutre{fill:#f3f4f6;stroke:#6b7280;stroke-width:1}
.bleu{fill:#e8f1fb;stroke:#2f6fb5;stroke-width:1}
.vert{fill:#e3f4ef;stroke:#2a8a72;stroke-width:1}
.orange{fill:#fdebe3;stroke:#c8623a;stroke-width:1}
.arr{fill:none;stroke:#59636e;stroke-width:1.5}
.trait{stroke:#d1d9e0;stroke-width:1}
</style>
<defs><marker id="fleche" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#59636e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect class="fond" x="0" y="0" width="720" height="850" rx="8"/>
<rect class="neutre" x="10" y="20" width="220" height="56" rx="8"/>
<text class="th" x="120" y="44" text-anchor="middle">Jérôme</text>
<text class="ts" x="120" y="63" text-anchor="middle">Navigateur ou IA</text>
<path class="arr" d="M120 76 L120 106" marker-end="url(#fleche)"/>
<rect class="neutre" x="250" y="20" width="220" height="56" rx="8"/>
<text class="th" x="360" y="44" text-anchor="middle">Les clients</text>
<text class="ts" x="360" y="63" text-anchor="middle">Navigateur ou IA</text>
<path class="arr" d="M360 76 L360 106" marker-end="url(#fleche)"/>
<rect class="neutre" x="490" y="20" width="220" height="56" rx="8"/>
<text class="th" x="600" y="44" text-anchor="middle">Les utilisateurs de la maison</text>
<text class="ts" x="600" y="63" text-anchor="middle">Navigateur ou IA</text>
<path class="arr" d="M600 76 L600 106" marker-end="url(#fleche)"/>
<rect class="bleu" x="10" y="110" width="220" height="420" rx="16"/>
<text class="th" x="120" y="135" text-anchor="middle">chevalier-ia-os</text>
<text class="ts" x="120" y="153" text-anchor="middle">CRM de Jérôme</text>
<rect class="bleu" x="250" y="110" width="220" height="420" rx="16"/>
<text class="th" x="360" y="135" text-anchor="middle">chevalier-ia-app</text>
<text class="ts" x="360" y="153" text-anchor="middle">Plateforme clients</text>
<rect class="bleu" x="490" y="110" width="220" height="420" rx="16"/>
<text class="th" x="600" y="135" text-anchor="middle">Une maison client</text>
<text class="ts" x="600" y="153" text-anchor="middle">son propre projet Google</text>
<rect class="vert" x="20" y="168" width="200" height="146" rx="10"/>
<text class="th" x="32" y="191">Firebase</text>
<text class="ts" x="32" y="213">chevalier-ia-os.web.app</text>
<text class="ts" x="32" y="233">Firestore : données</text>
<text class="ts" x="32" y="253">Storage : PDF</text>
<text class="ts" x="32" y="273">Fonctions : functions</text>
<text class="ts" x="32" y="293">mcp, porte, dépôt…</text>
<rect class="vert" x="260" y="168" width="200" height="146" rx="10"/>
<text class="th" x="272" y="191">Firebase</text>
<text class="ts" x="272" y="213">chevalier-ia-app.web.app</text>
<text class="ts" x="272" y="233">Firestore : espaces</text>
<text class="ts" x="272" y="253">Storage : PDF</text>
<text class="ts" x="272" y="273">functions-plateforme</text>
<text class="ts" x="272" y="293">mcpclients, porte</text>
<rect class="vert" x="500" y="168" width="200" height="146" rx="10"/>
<text class="th" x="512" y="191">Firebase</text>
<text class="ts" x="512" y="213">chevalier-ia-&lt;maison&gt;.web.app</text>
<text class="ts" x="512" y="233">Firestore : données</text>
<text class="ts" x="512" y="253">Storage : PDF</text>
<text class="ts" x="512" y="273">Fonctions : mcp, basePorte…</text>
<text class="ts" x="512" y="293">Écran neutre au départ</text>
<rect class="vert" x="20" y="330" width="200" height="76" rx="10"/>
<text class="th" x="120" y="353" text-anchor="middle">Client OAuth web</text>
<text class="ts" x="120" y="374" text-anchor="middle">URI de redirection</text>
<text class="ts" x="120" y="392" text-anchor="middle">et origines</text>
<rect class="vert" x="20" y="422" width="200" height="94" rx="10"/>
<text class="th" x="120" y="445" text-anchor="middle">Secret Manager</text>
<text class="ts" x="120" y="468" text-anchor="middle">Clés de Jérôme :</text>
<text class="ts" x="120" y="486" text-anchor="middle">MCP_JETONS,</text>
<text class="ts" x="120" y="504" text-anchor="middle">SUPABASE_INDICATEURS…</text>
<rect class="vert" x="260" y="330" width="200" height="76" rx="10"/>
<text class="th" x="360" y="353" text-anchor="middle">Client OAuth web</text>
<text class="ts" x="360" y="374" text-anchor="middle">URI de redirection</text>
<text class="ts" x="360" y="392" text-anchor="middle">et origines</text>
<rect class="vert" x="260" y="422" width="200" height="94" rx="10"/>
<text class="th" x="360" y="445" text-anchor="middle">Secret Manager</text>
<text class="ts" x="360" y="468" text-anchor="middle">Clés des clients :</text>
<text class="ts" x="360" y="486" text-anchor="middle">MCP_JETONS_CLIENTS,</text>
<text class="ts" x="360" y="504" text-anchor="middle">CLICKSEND_RDV_&lt;client&gt;…</text>
<rect class="vert" x="500" y="326" width="200" height="52" rx="10"/>
<text class="th" x="600" y="347" text-anchor="middle">Client OAuth web</text>
<text class="ts" x="600" y="366" text-anchor="middle">Ses propres URI et origines</text>
<rect class="vert" x="500" y="388" width="200" height="52" rx="10"/>
<text class="th" x="600" y="409" text-anchor="middle">Secret Manager</text>
<text class="ts" x="600" y="428" text-anchor="middle">Ses propres clés</text>
<rect class="vert" x="500" y="450" width="200" height="70" rx="10"/>
<text class="th" x="600" y="471" text-anchor="middle">Cloud SQL (PostgreSQL)</text>
<text class="ts" x="600" y="491" text-anchor="middle">Données des Achats,</text>
<text class="ts" x="600" y="508" text-anchor="middle">lues et écrites par la porte</text>
<path class="arr" d="M80 530 L80 576" marker-end="url(#fleche)"/>
<path class="arr" d="M190 530 L190 554 L300 554 L300 576" marker-end="url(#fleche)"/>
<path class="arr" d="M420 530 L420 576" marker-end="url(#fleche)"/>
<path class="arr" d="M600 530 L600 576" marker-end="url(#fleche)"/>
<rect class="orange" x="10" y="580" width="220" height="56" rx="8"/>
<text class="th" x="120" y="604" text-anchor="middle">Supabase</text>
<text class="ts" x="120" y="623" text-anchor="middle">Pilotage et Achats de Jérôme</text>
<rect class="orange" x="250" y="580" width="220" height="56" rx="8"/>
<text class="th" x="360" y="604" text-anchor="middle">n8n (partagé)</text>
<text class="ts" x="360" y="623" text-anchor="middle">n8n.chevalier-ia.fr</text>
<rect class="orange" x="490" y="580" width="220" height="56" rx="8"/>
<text class="th" x="600" y="604" text-anchor="middle">Son propre n8n</text>
<text class="ts" x="600" y="623" text-anchor="middle">workflows des Achats</text>
<line class="trait" x1="10" y1="660" x2="710" y2="660"/>
<text class="th" x="360" y="684" text-anchor="middle">Comment chaque colonne est publiée</text>
<rect class="neutre" x="10" y="698" width="220" height="92" rx="8"/>
<text class="th" x="120" y="721" text-anchor="middle">Automatique</text>
<text class="ts" x="120" y="742" text-anchor="middle">à chaque fusion d’une PR</text>
<text class="ts" x="120" y="760" text-anchor="middle">(site et fonctions) ; règles :</text>
<text class="ts" x="120" y="778" text-anchor="middle">workflow « Publier les règles »</text>
<rect class="neutre" x="250" y="698" width="220" height="92" rx="8"/>
<text class="th" x="360" y="721" text-anchor="middle">Bouton manuel</text>
<text class="ts" x="360" y="742" text-anchor="middle">workflow GitHub « Déploiement</text>
<text class="ts" x="360" y="760" text-anchor="middle">plateforme clients »,</text>
<text class="ts" x="360" y="778" text-anchor="middle">lancé par Jérôme</text>
<rect class="neutre" x="490" y="698" width="220" height="92" rx="8"/>
<text class="th" x="600" y="721" text-anchor="middle">Depuis le Mac</text>
<text class="ts" x="600" y="742" text-anchor="middle">commande firebase-tools</text>
<text class="ts" x="600" y="760" text-anchor="middle">(pas encore de</text>
<text class="ts" x="600" y="778" text-anchor="middle">workflow GitHub)</text>
<text class="ts" x="360" y="816" text-anchor="middle">Bleu et vert : dans le projet Google. Orange : services reliés (n8n, Supabase).</text>
<text class="ts" x="360" y="834" text-anchor="middle">La maison n’utilise pas Supabase : ses Achats sont sur Cloud SQL, dans son propre projet.</text>
</svg>
