<!doctype html>
<html lang="fr" data-theme="sombre">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Chevalier IA OS</title>
<meta name="description" content="Espace de travail de Chevalier IA.">
<meta name="theme-color" content="#1b1a1e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/logo/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Chevalier OS">
<link rel="preload" href="assets/fonts/poppins-500.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/be-vietnam-pro-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/os.css">
<link rel="stylesheet" href="css/crm.css">
<link rel="stylesheet" href="css/projets.css">
<script>
  // Thème appliqué avant l'affichage (évite un flash du mauvais thème).
  try { if (localStorage.getItem('chevalier-os.theme') === 'clair') document.documentElement.dataset.theme = 'clair'; } catch (e) {}
</script>
<script>
  // Largeur du menu choisie avec la poignée, posée avant le premier affichage (pas de saut). Mêmes bornes que MENU_LARGEUR dans js/os/shell.js ; valeur illisible = défaut du CSS.
  try { var l = localStorage.getItem('chevalier-os.menu-largeur'); if (/^\d{3}$/.test(l) && +l >= 200 && +l <= 420) document.documentElement.style.setProperty('--menu-largeur', l + 'px'); } catch (e) {}
</script>
<script>
  // Page d'un client (#/espace/<client>) : dès le premier affichage, rien de l'identité de Jérôme (titre, appli installée, icône).
  // js/os/identite.js met ensuite le nom, l'icône et les couleurs du client. Aucun effet sur le CRM (adresses sans « #/espace/ »).
  if (/^#\/espace\//.test(location.hash)) {
    document.title = 'Espace client';
    ['link[rel="manifest"]', 'link[rel="apple-touch-icon"]', 'link[rel="icon"]'].forEach(function (s) { var e = document.querySelector(s); if (e) e.remove(); });
  }
</script>
<script type="module" src="js/main.js"></script>
</head>
<body>
<div id="app"></div>
<noscript>Cette application a besoin de JavaScript.</noscript>
</body>
</html>
