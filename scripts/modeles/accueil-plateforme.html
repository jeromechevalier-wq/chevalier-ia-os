<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<title>Chevalier IA APP</title>
<link rel="icon" href="assets/logo/favicon.svg" type="image/svg+xml">
<script>
  // Les anciens liens de la forme /#/espace/<client> (et toute adresse avec « # ») ouvrent l'application, qui est publiée dans app.html.
  // Sans « # », c'est la racine : on affiche seulement cette page d'accueil neutre.
  if (/^#\/./.test(location.hash)) location.replace('app.html' + location.search + location.hash);
</script>
<style>
  :root { --fond: #f5f5f3; --carte: #ffffff; --texte: #29292c; --discret: #55545a; --trait: #d9d8d2; --accent: #341363; --jaune: #ecbc06; }
  @media (prefers-color-scheme: dark) {
    :root { --fond: #1b1a1e; --carte: #26252a; --texte: #f1f0ee; --discret: #b7b5bb; --trait: #3d3c43; --accent: #ffe56c; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px 16px; background: var(--fond); color: var(--texte); font: 16px/1.5 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
  main { width: 100%; max-width: 480px; padding: 32px 24px; background: var(--carte); border: 1px solid var(--trait); border-radius: 16px; text-align: center; }
  .marque { width: 56px; height: 56px; margin: 0 auto 16px; border-radius: 14px; background: var(--jaune); color: #29292c; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 20px; letter-spacing: .02em; }
  h1 { margin: 0 0 12px; font-size: 24px; line-height: 1.25; }
  p { margin: 0 0 12px; color: var(--discret); }
  code { display: inline-block; max-width: 100%; padding: 4px 10px; border-radius: 8px; border: 1px solid var(--trait); color: var(--texte); background: var(--fond); font: 15px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; overflow-wrap: anywhere; }
  a { color: var(--accent); }
  a:focus-visible { outline: 3px solid var(--jaune); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <div class="marque" aria-hidden="true">IA</div>
  <h1>Chevalier IA APP</h1>
  <p>Cette page d'accueil n'ouvre aucun espace. Pour entrer, utilisez le lien de votre espace, celui qui vous a été envoyé.</p>
  <p>Il ressemble à <code>/espace/nom-de-votre-espace</code></p>
  <p>Vous n'avez pas ce lien ? Demandez-le à la personne qui vous accompagne.</p>
  <noscript><p>Cette page a besoin de JavaScript pour ouvrir votre espace.</p></noscript>
</main>
</body>
</html>
