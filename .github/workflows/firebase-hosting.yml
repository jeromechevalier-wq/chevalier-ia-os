# Déploiement automatique à chaque push sur main : d'abord les fonctions (serveur MCP, Paris), puis Firebase Hosting (canal live).
# Si les fonctions échouent, Hosting n'est pas déployé (la réécriture /mcp pointe vers la fonction, qui doit exister).
# Les règles Firestore restent hors déploiement (publiées à la main dans la console).
name: Déploiement Firebase Hosting
on:
  push:
    branches:
      - main
jobs:
  deployer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Installer les dépendances des fonctions (versions figées par package-lock.json)
        run: npm ci --prefix functions
      - name: Afficher le compte de déploiement (son adresse seulement, jamais la clé)
        env:
          COMPTE_DE_SERVICE: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CHEVALIER_IA_OS }}
        # Aide au diagnostic des erreurs de droits (« quel compte faut-il autoriser ? »). L'adresse n'est pas un secret ; le « arobase »
        # évite seulement que GitHub la masque par erreur dans le journal.
        run: |
          node -e 'try { console.log("Compte de déploiement :", JSON.parse(process.env.COMPTE_DE_SERVICE).client_email.replace("@", " arobase ")); } catch { console.log("Compte de déploiement : illisible"); }'
      # Paramètres de la fonction devisPdf (module Devis) : adresse du service Gotenberg et dossier Drive racine. Ce ne sont pas des secrets
      # (variables du dépôt : GitHub > Settings > Secrets and variables > Actions > Variables). Absentes : le fichier n'est pas écrit et la
      # fonction répond « PDF non configuré ».
      - name: Écrire les paramètres de la fonction devisPdf (si renseignés)
        env:
          GOTENBERG_URL: ${{ vars.GOTENBERG_URL }}
          DRIVE_RACINE_DEVIS_ID: ${{ vars.DRIVE_RACINE_DEVIS_ID }}
        run: |
          if [ -n "$GOTENBERG_URL" ] && [ -n "$DRIVE_RACINE_DEVIS_ID" ]; then
            printf 'GOTENBERG_URL=%s\nDRIVE_RACINE_DEVIS_ID=%s\n' "$GOTENBERG_URL" "$DRIVE_RACINE_DEVIS_ID" > functions/.env.chevalier-ia-os
            echo "Paramètres de devisPdf écrits."
          else
            echo "Paramètres de devisPdf absents : PDF non configuré."
          fi
      # --force : sans lui, en mode non interactif, l'outil échoue APRÈS avoir déployé la fonction parce qu'il ne peut pas proposer
      # la règle de nettoyage des anciennes images (Artifact Registry). Effet à connaître : une fonction retirée du code est aussi
      # supprimée chez Google au déploiement suivant.
      - name: Déployer les fonctions
        env:
          COMPTE_DE_SERVICE: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CHEVALIER_IA_OS }}
        run: |
          fichier="$RUNNER_TEMP/compte-de-service.json"
          (umask 077; printf '%s' "$COMPTE_DE_SERVICE" > "$fichier")
          trap 'rm -f "$fichier"' EXIT
          GOOGLE_APPLICATION_CREDENTIALS="$fichier" npx --yes firebase-tools@15.32.0 deploy --only functions --project chevalier-ia-os --non-interactive --force
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CHEVALIER_IA_OS }}
          channelId: live
          projectId: chevalier-ia-os
