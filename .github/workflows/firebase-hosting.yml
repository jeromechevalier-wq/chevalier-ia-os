# Déploiement automatique à chaque push sur main : d'abord les fonctions (serveur MCP, Paris), puis Firebase Hosting (canal live).
# Si les fonctions échouent, Hosting n'est pas déployé (la réécriture /mcp pointe vers la fonction, qui doit exister).
# Les règles Firestore restent hors de ce déploiement automatique : elles se publient avec le workflow MANUEL « Publier les règles (CRM de Jérôme) »
# (.github/workflows/publier-regles.yml ; mode d'emploi dans docs/securite-et-pannes.md).
name: Déploiement Firebase Hosting
on:
  push:
    branches:
      - main
    # (31/10/2026) Une fusion qui ne change que de la documentation ne redéploie rien : ces chemins sont tous dans hosting.ignore de firebase.json (non servis) ou hors de tout déploiement. Un push qui mêle docs et code déploie quand même. tests/** n'est PAS ignoré.
    paths-ignore:
      - 'docs/**'
      - 'wiki/**'
      - 'README.md'
      - 'CLAUDE.md'
      - 'PROMPT-CONSTRUCTION.md'
      - '.github/A-FAIRE.md'
# Un seul déploiement à la fois : sans ça, un run plus ancien qui finit en dernier republie l'ancien arbre par-dessus un plus récent (30/10/2026).
# GitHub ne garde qu'UN run en attente (le plus récent) ; false = on ne coupe jamais un déploiement en cours (fonctions).
concurrency:
  group: deploiement-hosting
  cancel-in-progress: false
jobs:
  deployer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Installer les dépendances des fonctions (versions figées par package-lock.json)
        run: npm ci --prefix functions
      - name: Afficher le compte de déploiement (son adresse seulement, jamais la clé)
        env:
          COMPTE_DE_SERVICE: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CHEVALIER_IA_OS }}
        # Aide au diagnostic des erreurs de droits (« quel compte faut-il autoriser ? »). L'adresse n'est pas un secret ; le « arobase »
        # évite seulement que GitHub la masque par erreur dans le journal.
        run: |
          node -e 'try { console.log("Compte de déploiement :", JSON.parse(process.env.COMPTE_DE_SERVICE).client_email.replace("@", " arobase ")); } catch { console.log("Compte de déploiement : illisible"); }'
      # --force : sans lui, en mode non interactif, l'outil échoue APRÈS avoir déployé la fonction parce qu'il ne peut pas proposer
      # la règle de nettoyage des anciennes images (Artifact Registry). Effet à connaître : une fonction retirée du code est aussi
      # supprimée chez Google au déploiement suivant.
      - name: Déployer les fonctions
        env:
          COMPTE_DE_SERVICE: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CHEVALIER_IA_OS }}
        run: |
          fichier="$RUNNER_TEMP/compte-de-service.json"
          (umask 077; printf '%s' "$COMPTE_DE_SERVICE" > "$fichier")
          trap 'rm -f "$fichier"' EXIT
          GOOGLE_APPLICATION_CREDENTIALS="$fichier" npx --yes firebase-tools@15.32.0 deploy --only functions --project chevalier-ia-os --non-interactive --force
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CHEVALIER_IA_OS }}
          channelId: live
          projectId: chevalier-ia-os
      # Mesure du temps d'attente (31/10/2026) : durée de chaque job de ce lancement, dans le résumé. Ne fait jamais échouer le déploiement.
      - name: Mesurer la durée du déploiement (résumé du lancement)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### Durée du déploiement"
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" > "$RUNNER_TEMP/jobs.json"; then
              echo
              echo "| job | durée |"
              echo "|---|---|"
              jq -r '[.jobs[] | select(.started_at != null) | {n: .name, s: ((if .completed_at then (.completed_at | fromdateiso8601) else now end) - (.started_at | fromdateiso8601))}] | (.[] | "| \(.n) | \(.s / 60 | floor) min \(.s % 60) s |")' "$RUNNER_TEMP/jobs.json"
            else
              echo "Mesure impossible (l'API des jobs n'a pas répondu) : sans effet sur le déploiement."
            fi
          } >> "$GITHUB_STEP_SUMMARY" || echo "Mesure impossible : sans effet sur le déploiement."
