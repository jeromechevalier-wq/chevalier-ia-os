# Déploiement automatique sur Firebase Hosting (canal live) à chaque push sur main.
name: Déploiement Firebase Hosting
on:
  push:
    branches:
      - main
jobs:
  deployer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CHEVALIER_IA_OS }}
          channelId: live
          projectId: chevalier-ia-os
