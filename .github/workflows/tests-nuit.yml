# Tests de nuit sur main : ordinateur ET téléphone, chaque scénario 1 fois (3 avec TESTS_REPETER=3).
# Aucun secret : émulateurs Firebase, projet demo-chevalier-ia-os.
name: Tests de nuit
on:
  schedule:
    # Essai d'UNE seule nuit (décision de Jérôme, 18/10/2026) : le 19 octobre à 0 h 17 UTC = 2 h 17 à Paris (heure d'été).
    # Les minutes ≠ 0 évitent l'heure pile, où GitHub retarde ou saute des runs. Le jour et le mois reviennent chaque année :
    # après l'essai, soit remettre '17 0 * * *' (toutes les nuits), soit supprimer cette ligne (sinon il se relancera le 19/10/2027).
    - cron: '17 0 19 10 *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  nuit:
    name: Tests de nuit
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CI: 'true'
      # Le navigateur de test est réglé sur Europe/Paris ; le processus Node doit l'être aussi (sinon les heures attendues par certains tests sont décalées de 2 h).
      TZ: Europe/Paris
      TESTS_WORKERS: '2'
      # 1 seul passage : à 3 passages, le run dépasse 2 h (essai du 18/10/2026) et épuiserait à lui seul le quota de 2 000 minutes par mois.
      TESTS_REPETER: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            tests/package-lock.json
            functions/package-lock.json
            functions-plateforme/package-lock.json
            scripts/plateforme/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Installer les dépendances (versions figées par package-lock.json)
        run: |
          npm ci --prefix tests
          npm ci --prefix functions
          npm ci --prefix functions-plateforme
          npm ci --prefix scripts/plateforme
      - name: Installer le navigateur de test
        run: npx playwright install chromium --with-deps
        working-directory: tests
      - name: Suite de nuit (ordinateur et téléphone)
        run: npm run test:nuit
        working-directory: tests
      - name: Rapport et captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-nuit
          path: |
            tests/test-results
            tests/playwright-report
            tests/.config-ports/*.log
          retention-days: 14
          include-hidden-files: true
          if-no-files-found: ignore
