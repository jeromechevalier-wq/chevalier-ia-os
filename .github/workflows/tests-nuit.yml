# Tests de nuit sur main : ordinateur ET téléphone, chaque scénario 1 fois, en parties comme le palier complet des PR (tests.yml).
# Aucun secret : émulateurs Firebase, projet demo-chevalier-ia-os.
name: Tests de nuit
on:
  schedule:
    # Chaque nuit à 0 h 17 UTC = 2 h 17 à Paris en heure d'été (1 h 17 en hiver). Les minutes ≠ 0 évitent l'heure pile, où GitHub retarde ou saute des runs.
    # Le job « changement » ne laisse la suite tourner que si `main` a reçu un commit dans les 26 dernières heures (décision de Jérôme, 18/10/2026 :
    # il ne développe pas tous les jours, et une nuit sans nouveau commit ne sert à rien et mange le quota de 2 000 minutes).
    - cron: '17 0 * * *'
  workflow_dispatch:
permissions:
  contents: read
# Un lancement manuel tard le soir et le run de nuit ne tournent jamais en même temps (ports et quota) ; le second attend, rien n'est annulé.
concurrency:
  group: tests-nuit
  cancel-in-progress: false
jobs:
  changement:
    name: Main a-t-il changé ?
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      lancer: ${{ steps.verif.outputs.lancer }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - id: verif
        run: |
          # Lancement à la main : toujours. Nuit : seulement si un commit est arrivé sur main depuis ~26 h.
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "lancer=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$(git log --since='26 hours ago' --oneline)" ]; then
            echo "lancer=true" >> "$GITHUB_OUTPUT"
          else
            echo "lancer=false" >> "$GITHUB_OUTPUT"
            echo "Aucun commit sur main depuis 26 h : pas de tests cette nuit."
          fi
  # Même répartition que le palier complet des PR (tests.yml) : 6 parties par format (ordinateur ET téléphone) + les séries sans navigateur, chacune sur sa machine.
  # Une seule machine pour tout dépassait 89 min (run 40601396308, 27/10/2026) ; en parties, chaque job dure ≈ 5 à 10 min. Aucun job ne s'appelle « Tests » (nom réservé à la coche des PR).
  nuit-navigateur:
    name: Nuit navigateur ${{ matrix.format }} ${{ matrix.partie }}/6
    needs: changement
    if: needs.changement.outputs.lancer == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { format: ordinateur, partie: 1, decalage: 1 }
          - { format: ordinateur, partie: 2, decalage: 3 }
          - { format: ordinateur, partie: 3, decalage: 4 }
          - { format: ordinateur, partie: 4, decalage: 5 }
          - { format: ordinateur, partie: 5, decalage: 6 }
          - { format: ordinateur, partie: 6, decalage: 8 }
          - { format: telephone, partie: 1, decalage: 10 }
          - { format: telephone, partie: 2, decalage: 11 }
          - { format: telephone, partie: 3, decalage: 12 }
          - { format: telephone, partie: 4, decalage: 13 }
          - { format: telephone, partie: 5, decalage: 14 }
          - { format: telephone, partie: 6, decalage: 15 }
    env:
      CI: 'true'
      # Le navigateur de test est réglé sur Europe/Paris ; le processus Node doit l'être aussi (sinon les heures attendues par certains tests sont décalées de 2 h).
      TZ: Europe/Paris
      TESTS_WORKERS: '2'
      # Chaque partie a sa machine ; TESTS_DECALAGE les distingue comme dans tests.yml (jamais 2 ni 7).
      TESTS_DECALAGE: ${{ matrix.decalage }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            tests/package-lock.json
            functions/package-lock.json
            functions-plateforme/package-lock.json
            scripts/plateforme/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Installer les dépendances (versions figées par package-lock.json)
        run: |
          npm ci --prefix tests
          npm ci --prefix functions
          npm ci --prefix functions-plateforme
          npm ci --prefix scripts/plateforme
      # restore + save séparés : le cache est enregistré tout de suite après l'installation. Avec `actions/cache` seul, l'enregistrement se fait en fin de job et saute si le job échoue ou est annulé : le navigateur (≈ 10 min) était alors retéléchargé à chaque run.
      - name: Cache du navigateur Playwright
        id: navigateur
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tests/package-lock.json') }}
      - name: Installer le navigateur de test
        if: steps.navigateur.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps
        working-directory: tests
      - name: Enregistrer le navigateur dans le cache
        if: steps.navigateur.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tests/package-lock.json') }}
      # Navigateur en cache : il manque seulement les bibliothèques système (installées par apt, hors du cache).
      - name: Bibliothèques système du navigateur (navigateur déjà en cache)
        if: steps.navigateur.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
        working-directory: tests
      - name: Parcours navigateur, partie ${{ matrix.partie }} sur 6 (${{ matrix.format }})
        run: node lancer-tout.js --e2e --project=${{ matrix.format }} --shard=${{ matrix.partie }}/6
        working-directory: tests
      - name: Rapport et captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-nuit-navigateur-${{ matrix.format }}-${{ matrix.partie }}
          path: |
            tests/test-results
            tests/playwright-report
            tests/.config-ports/*.log
            tests/.config-ports/*/*.log
          retention-days: 14
          include-hidden-files: true
          if-no-files-found: ignore

  # Séries sans navigateur (noyau, storage, outil client, automatisations) : les mêmes que « Complet sans navigateur » de tests.yml.
  nuit-sans-navigateur:
    name: Nuit sans navigateur
    needs: changement
    if: needs.changement.outputs.lancer == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: 'true'
      TZ: Europe/Paris
      TESTS_DECALAGE: '9'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            tests/package-lock.json
            functions/package-lock.json
            functions-plateforme/package-lock.json
            scripts/plateforme/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Installer les dépendances (versions figées par package-lock.json)
        run: |
          npm ci --prefix tests
          npm ci --prefix functions
          npm ci --prefix functions-plateforme
          npm ci --prefix scripts/plateforme
      # restore + save séparés : le cache est enregistré tout de suite après l'installation. Avec `actions/cache` seul, l'enregistrement se fait en fin de job et saute si le job échoue ou est annulé : le navigateur (≈ 10 min) était alors retéléchargé à chaque run.
      - name: Cache du navigateur Playwright
        id: navigateur
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tests/package-lock.json') }}
      - name: Installer le navigateur de test
        if: steps.navigateur.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps
        working-directory: tests
      - name: Enregistrer le navigateur dans le cache
        if: steps.navigateur.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tests/package-lock.json') }}
      # Navigateur en cache : il manque seulement les bibliothèques système (installées par apt, hors du cache).
      - name: Bibliothèques système du navigateur (navigateur déjà en cache)
        if: steps.navigateur.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
        working-directory: tests
      # Les 4 séries démarrent en même temps : l'émulateur Firestore est téléchargé UNE fois avant (voir tests.yml).
      - name: Cache de l'émulateur Firestore
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: emulateurs-firebase-${{ runner.os }}-${{ hashFiles('tests/package-lock.json') }}
      - name: Télécharger l'émulateur Firestore (une seule fois)
        run: npx firebase setup:emulators:firestore
        working-directory: tests
      - name: Séries sans navigateur (noyau, storage, outil client, automatisations)
        run: npm run test:complet-sans-navigateur
        working-directory: tests
      - name: Rapport et captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-nuit-sans-navigateur
          path: |
            tests/test-results
            tests/playwright-report
            tests/.config-ports/*.log
            tests/.config-ports/*/*.log
          retention-days: 14
          include-hidden-files: true
          if-no-files-found: ignore

  alerte:
    # Nuit rouge : ouvre une issue GitHub (GitHub t'envoie un email) pour que tu le saches sans aller dans Actions.
    name: Alerte si la nuit est rouge
    needs: [nuit-navigateur, nuit-sans-navigateur]
    # Un job qui dépasse son délai est « cancelled », pas « failure » : sans ce test, aucune issue ne s'ouvrait (runs 14 à 20). Une annulation à la main ouvre donc aussi une issue. Dépend de TOUS les jobs de tests.
    if: ${{ always() && (needs.nuit-navigateur.result == 'failure' || needs.nuit-navigateur.result == 'cancelled' || needs.nuit-sans-navigateur.result == 'failure' || needs.nuit-sans-navigateur.result == 'cancelled') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Ouvrir une issue
        env:
          GH_TOKEN: ${{ github.token }}
          LIEN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create --repo "${{ github.repository }}" \
            --title "Tests de nuit rouges ($(date -u +%F))" \
            --body "Le test de nuit a échoué ou le délai a été dépassé (job annulé). Détail et captures : $LIEN. Chercher quelle fusion de la journée est en cause ; au besoin, annuler cette fusion (revert) puis fusionner, ce qui redéploie le CRM."
