# Tests sur chaque PR vers main : RAPIDE par défaut (niveau « rapide » puis « smoke », environ 3 à 4 minutes avec l'installation).
# (25/10/2026) Une PR qui touche functions-plateforme/ ne lance plus le palier complet : elle rejoue les séries de la plateforme (automatisations, outil client, storage) et 2 parcours, environ 6 minutes. Le navigateur de test est mis en cache (environ 2 minutes de moins par test).
# Le palier COMPLET (format ordinateur) ne tourne que dans trois cas (décision de Jérôme, 19/10/2026, avis de Fable) :
#   1. la PR touche des fichiers sensibles (règles de sécurité, configuration Firebase, workflows GitHub, outillage des tests) ; functions/ n'en fait plus partie (19/10/2026) : le niveau rapide en teste déjà les fonctions (test:fonctions) ; un simple fichier de test ajouté ou modifié (tests/*.test.js, tests/e2e/*.spec.js) n'en fait plus partie (21/10/2026, voir la 4e étape ci-dessous) ;
#   2. la PR porte l'étiquette « tests-complets » ;
#   3. lancement à la main avec « complet » coché (par défaut).
# En plus du rapide et du smoke, la PR rejoue SES propres parcours navigateur : les fichiers tests/e2e/*.spec.js qu'elle ajoute ou modifie (format ordinateur). Les fichiers de test unitaires modifiés tournent déjà dans le niveau rapide.
# Le test complet (ordinateur + téléphone) rejoue tout chaque nuit : voir tests-nuit.yml (alerte par issue GitHub si la nuit est rouge).
# (25/10/2026) Le palier complet est découpé en 7 jobs parallèles (6 parties des parcours navigateur + les séries sans navigateur) au lieu d'un seul job de 25 à 30 minutes ; le job final « Tests » les réunit. Le chemin rapide est inchangé (un seul job, mêmes étapes).
# (31/10/2026) Voie « Docs » : une PR qui ne change QUE de la documentation (docs/, wiki/, README.md, CLAUDE.md, PROMPT-CONSTRUCTION.md, .github/A-FAIRE.md) ne lance plus le niveau rapide (navigateur, émulateurs) mais seulement les 7 fichiers de test qui lisent docs/ (npm run test:docs, environ 1 à 2 minutes). La décision est dans tests/niveau-de-test.js (testée hors réseau).
# Le job final « Tests » écrit aussi, dans le résumé du lancement, la durée de chaque job et le total (mesure du temps d'attente).
# Le résultat est la coche GitHub « Tests » (le dernier job, qui réunit les autres) : on fusionne quand elle est verte. Aucun secret : émulateurs Firebase, projet demo-chevalier-ia-os.
name: Tests
on:
  pull_request:
    branches: [main]
    # « labeled » : ajouter l'étiquette « tests-complets » relance le test en complet.
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      complet:
        description: Lancer le palier complet (sinon rapide + smoke)
        type: boolean
        default: true
concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  # Décide du niveau : rapide, plateforme ou complet (mêmes règles qu'avant). Pas d'installation : quelques secondes.
  niveau:
    name: Niveau de test
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      complet: ${{ steps.niveau.outputs.complet }}
      plateforme: ${{ steps.niveau.outputs.plateforme }}
      specs: ${{ steps.niveau.outputs.specs }}
      docs: ${{ steps.niveau.outputs.docs }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Choisir le niveau de test (rapide ou complet)
        id: niveau
        env:
          EVENEMENT: ${{ github.event_name }}
          COMPLET_DEMANDE: ${{ inputs.complet }}
          ETIQUETTES: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          BASE: ${{ github.event.pull_request.base.sha }}
        # Règles (fichiers sensibles, étiquette « tests-complets », plateforme, parcours de la PR, docs seules) : tests/niveau-de-test.js.
        run: node tests/niveau-de-test.js

  # Chemin rapide (PR ordinaires) : un seul job, mêmes étapes qu'avant.
  rapide:
    name: Rapide
    needs: niveau
    if: needs.niveau.outputs.complet != 'true' && needs.niveau.outputs.docs != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: 'true'
      # Le navigateur de test est réglé sur Europe/Paris ; le processus Node doit l'être aussi (sinon les heures attendues par certains tests sont décalées de 2 h).
      TZ: Europe/Paris
      TESTS_WORKERS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            tests/package-lock.json
            functions/package-lock.json
            functions-plateforme/package-lock.json
            scripts/plateforme/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Installer les dépendances (versions figées par package-lock.json)
        run: |
          npm ci --prefix tests
          npm ci --prefix functions
          npm ci --prefix functions-plateforme
          npm ci --prefix scripts/plateforme
      - name: Cache du navigateur Playwright
        id: navigateur
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tests/package-lock.json') }}
      - name: Installer le navigateur de test
        if: steps.navigateur.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps
        working-directory: tests
      # Navigateur en cache : il manque seulement les bibliothèques système (installées par apt, hors du cache).
      - name: Bibliothèques système du navigateur (navigateur déjà en cache)
        if: steps.navigateur.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
        working-directory: tests
      - name: Niveau rapide (règles, logique, statique, fonctions)
        run: npm run test:rapide
        working-directory: tests
      - name: Smoke (5 parcours essentiels dans le navigateur)
        run: npm run test:smoke
        working-directory: tests
      - name: Parcours de cette PR (fichiers tests/e2e/*.spec.js ajoutés ou modifiés, ordinateur)
        if: needs.niveau.outputs.specs != ''
        env:
          SPECS: ${{ needs.niveau.outputs.specs }}
        # $SPECS non entouré de guillemets exprès : une liste de fichiers séparés par des espaces (noms limités à [A-Za-z0-9._-] plus haut).
        run: node lancer-tout.js --e2e $SPECS --project=ordinateur
        working-directory: tests
      - name: Séries de la plateforme clients (PR qui touche functions-plateforme/)
        if: needs.niveau.outputs.plateforme == 'true'
        run: |
          npm run test:automatisations
          npm run test:outil-client
          npm run test:storage
          node lancer-tout.js --e2e e2e/mon-espace.spec.js e2e/sans-pause.spec.js --project=ordinateur
        working-directory: tests
      - name: Captures et rapport en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tests-echec-rapide
          path: |
            tests/test-results
            tests/playwright-report
            tests/.config-ports/*.log
          retention-days: 7
          include-hidden-files: true
          if-no-files-found: ignore

  # Voie « Docs » : PR qui ne change que de la documentation. Pas de navigateur, pas d'émulateur, pas de Java : seulement les tests qui lisent docs/ (environ 1 à 2 minutes).
  docs:
    name: Docs
    needs: niveau
    if: needs.niveau.outputs.docs == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: 'true'
      TZ: Europe/Paris
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            tests/package-lock.json
            functions/package-lock.json
            functions-plateforme/package-lock.json
            scripts/plateforme/package-lock.json
      - name: Installer les dépendances (versions figées par package-lock.json)
        run: |
          npm ci --prefix tests
          npm ci --prefix functions
          npm ci --prefix functions-plateforme
      # Si wiki/ n'est pas régénéré après un changement de docs/, ce job est rouge (message du test W6 : node scripts/wiki/construire.js).
      - name: Tests qui lisent docs/ (statique, wiki, automatisations, devis par e-mail, menu, déploiement plateforme)
        run: npm run test:docs
        working-directory: tests

  # Palier complet, partie navigateur : les parcours format ordinateur, en 6 parties (Playwright --shard). Chaque partie a ses émulateurs et ses ports sur sa propre machine ; TESTS_DECALAGE sert à les distinguer (jamais 2 ni 7).
  complet-navigateur:
    name: Complet navigateur ${{ matrix.partie }}/6
    needs: niveau
    if: needs.niveau.outputs.complet == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { partie: 1, decalage: 1 }
          - { partie: 2, decalage: 3 }
          - { partie: 3, decalage: 4 }
          - { partie: 4, decalage: 5 }
          - { partie: 5, decalage: 6 }
          - { partie: 6, decalage: 8 }
    env:
      CI: 'true'
      # Le navigateur de test est réglé sur Europe/Paris ; le processus Node doit l'être aussi (sinon les heures attendues par certains tests sont décalées de 2 h).
      TZ: Europe/Paris
      TESTS_WORKERS: '2'
      TESTS_DECALAGE: ${{ matrix.decalage }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            tests/package-lock.json
            functions/package-lock.json
            functions-plateforme/package-lock.json
            scripts/plateforme/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Installer les dépendances (versions figées par package-lock.json)
        run: |
          npm ci --prefix tests
          npm ci --prefix functions
          npm ci --prefix functions-plateforme
          npm ci --prefix scripts/plateforme
      - name: Cache du navigateur Playwright
        id: navigateur
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tests/package-lock.json') }}
      - name: Installer le navigateur de test
        if: steps.navigateur.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps
        working-directory: tests
      # Navigateur en cache : il manque seulement les bibliothèques système (installées par apt, hors du cache).
      - name: Bibliothèques système du navigateur (navigateur déjà en cache)
        if: steps.navigateur.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
        working-directory: tests
      - name: Parcours navigateur, partie ${{ matrix.partie }} sur 6 (ordinateur)
        run: node lancer-tout.js --e2e --project=ordinateur --shard=${{ matrix.partie }}/6
        working-directory: tests
      - name: Captures et rapport en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tests-echec-navigateur-${{ matrix.partie }}
          path: |
            tests/test-results
            tests/playwright-report
            tests/.config-ports/*.log
          retention-days: 7
          include-hidden-files: true
          if-no-files-found: ignore

  # Palier complet, tout le reste : règles, logique, statique, fonctions, porte, storage, outil client, automatisations (4 séries d'émulateurs en même temps, comme avant).
  complet-sans-navigateur:
    name: Complet sans navigateur
    needs: niveau
    if: needs.niveau.outputs.complet == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: 'true'
      # Le navigateur de test est réglé sur Europe/Paris ; le processus Node doit l'être aussi (sinon les heures attendues par certains tests sont décalées de 2 h).
      TZ: Europe/Paris
      TESTS_DECALAGE: '9'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            tests/package-lock.json
            functions/package-lock.json
            functions-plateforme/package-lock.json
            scripts/plateforme/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Installer les dépendances (versions figées par package-lock.json)
        run: |
          npm ci --prefix tests
          npm ci --prefix functions
          npm ci --prefix functions-plateforme
          npm ci --prefix scripts/plateforme
      - name: Cache du navigateur Playwright
        id: navigateur
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tests/package-lock.json') }}
      - name: Installer le navigateur de test
        if: steps.navigateur.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps
        working-directory: tests
      # Navigateur en cache : il manque seulement les bibliothèques système (installées par apt, hors du cache).
      - name: Bibliothèques système du navigateur (navigateur déjà en cache)
        if: steps.navigateur.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
        working-directory: tests
      # Les 4 séries démarrent en même temps et téléchargeaient chacune le même émulateur Firestore (fichier abîmé, « exited with code 1 ») :
      # on le télécharge UNE fois avant, et on le garde en cache entre les coches.
      - name: Cache de l'émulateur Firestore
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: emulateurs-firebase-${{ runner.os }}-${{ hashFiles('tests/package-lock.json') }}
      - name: Télécharger l'émulateur Firestore (une seule fois)
        run: npx firebase setup:emulators:firestore
        working-directory: tests
      - name: Séries sans navigateur (noyau, storage, outil client, automatisations)
        run: npm run test:complet-sans-navigateur
        working-directory: tests
      - name: Captures et rapport en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tests-echec-sans-navigateur
          path: |
            tests/test-results
            tests/playwright-report
            tests/.config-ports/*.log
          retention-days: 7
          include-hidden-files: true
          if-no-files-found: ignore

  # La coche obligatoire de la protection de branche. Elle tourne toujours (always) et vérifie le résultat de chaque job :
  # - le niveau doit avoir réussi ;
  # - niveau « docs » : le job Docs doit avoir réussi, et Rapide et les jobs du complet doivent avoir été sautés ;
  # - niveau « rapide » : le job Rapide doit avoir réussi, et Docs et les jobs du complet doivent avoir été sautés ;
  # - niveau « complet » : les 6 parties navigateur ET le job sans navigateur doivent avoir réussi, et Rapide et Docs doivent avoir été sautés.
  # Un job échoué, annulé ou sauté à tort => échec. Ne jamais renommer ce job (le nom « Tests » est celui que GitHub exige).
  final:
    name: Tests
    needs: [niveau, rapide, docs, complet-navigateur, complet-sans-navigateur]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: Réunir les résultats
        env:
          NIVEAU: ${{ needs.niveau.result }}
          COMPLET: ${{ needs.niveau.outputs.complet }}
          DOCS_NIVEAU: ${{ needs.niveau.outputs.docs }}
          RAPIDE: ${{ needs.rapide.result }}
          DOCS: ${{ needs.docs.result }}
          NAVIGATEUR: ${{ needs.complet-navigateur.result }}
          SANS_NAVIGATEUR: ${{ needs.complet-sans-navigateur.result }}
        run: |
          echo "niveau=$NIVEAU complet=$COMPLET docs=$DOCS_NIVEAU | rapide=$RAPIDE docs=$DOCS navigateur=$NAVIGATEUR sans-navigateur=$SANS_NAVIGATEUR"
          if [ "$NIVEAU" != "success" ]; then echo "Le choix du niveau n'a pas réussi : ÉCHEC."; exit 1; fi
          if [ "$COMPLET" = "true" ]; then
            [ "$NAVIGATEUR" = "success" ] && [ "$SANS_NAVIGATEUR" = "success" ] && [ "$RAPIDE" = "skipped" ] && [ "$DOCS" = "skipped" ] || { echo "Palier complet : une partie a échoué, a été annulée ou n'a pas tourné : ÉCHEC."; exit 1; }
          elif [ "$DOCS_NIVEAU" = "true" ]; then
            [ "$DOCS" = "success" ] && [ "$RAPIDE" = "skipped" ] && [ "$NAVIGATEUR" = "skipped" ] && [ "$SANS_NAVIGATEUR" = "skipped" ] || { echo "Niveau docs : le job Docs a échoué, a été annulé ou n'a pas tourné : ÉCHEC."; exit 1; }
          else
            [ "$RAPIDE" = "success" ] && [ "$DOCS" = "skipped" ] && [ "$NAVIGATEUR" = "skipped" ] && [ "$SANS_NAVIGATEUR" = "skipped" ] || { echo "Niveau rapide : le job Rapide a échoué, a été annulé ou n'a pas tourné : ÉCHEC."; exit 1; }
          fi
          echo "Tout est vert."
      # Mesure du temps d'attente : durée de chaque job du lancement. Ne fait jamais échouer « Tests » (si l'API ne répond pas, un message suffit).
      - name: Mesurer le temps d'attente (résumé du lancement)
        if: always()
        continue-on-error: true
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          NIVEAU_TEXTE: ${{ needs.niveau.outputs.complet == 'true' && 'complet' || (needs.niveau.outputs.docs == 'true' && 'docs' || 'rapide') }}
        run: |
          {
            echo "### Temps d'attente — niveau : $NIVEAU_TEXTE"
            if timeout 60 gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" > "$RUNNER_TEMP/jobs.json"; then
              echo
              echo "| job | durée |"
              echo "|---|---|"
              jq -r '[.jobs[] | select(.conclusion != "skipped" and .started_at != null and .completed_at != null) | {n: .name, s: (((.completed_at | fromdateiso8601) - (.started_at | fromdateiso8601)))}] | (.[] | "| \(.n) | \(.s / 60 | floor) min \(.s % 60) s |"), "| **Total des jobs (temps machine)** | **\(([.[].s] | add // 0) / 60 | floor) min \(([.[].s] | add // 0) % 60) s** |"' "$RUNNER_TEMP/jobs.json"
            else
              echo "Mesure impossible (l'API des jobs n'a pas répondu) : sans effet sur la coche."
            fi
          } >> "$GITHUB_STEP_SUMMARY" || echo "Mesure impossible : sans effet sur la coche."
